<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>大鱼吃小鱼</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <style>
        body {margin:0;background:#082040;text-align:center;}
    </style>
</head>
<body>
<div id="game"></div>
<script>
const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    parent: 'game',
    physics: {
        default: 'arcade',
        debug:false
    },
    scene: {
        preload: preload,
        create: create,
        update: update
    }
};

new Phaser.Game(config);
let player;
let fishGroup;
let cursors;
let scoreText;
let score = 0;

function preload(){}

function create(){
    //玩家小鱼，白色
    player = this.add.ellipse(400,300,40,24,0xffffff);
    this.physics.add.existing(player);
    player.body.setCollideWorldBounds(true);

    fishGroup = this.physics.add.group();
    //生成一堆鱼
    for(let i=0;i<12;i++){
        spawnFish.call(this);
    }

    cursors = this.input.keyboard.createCursorKeys();
    scoreText = this.add.text(10,10,"分数：0",{font:"22px Arial",fill:"#fff"});

    //碰撞逻辑：大吃小
    this.physics.add.overlap(player,fishGroup,eatFish,null,this);
}

function spawnFish(){
    let sizeX = Phaser.Math.Between(15,60);
    let sizeY = sizeX*0.6;
    let fish = this.add.ellipse(
        Phaser.Math.Between(50,750),
        Phaser.Math.Between(50,550),
        sizeX,sizeY,
        Phaser.Display.Color.RandomRGB().color
    );
    this.physics.add.existing(fish);
    fish.speed = Phaser.Math.Between(40,120);
    fish.dir = Phaser.Math.Between(0,1)?1:-1;
    fish.body.velocity.x = fish.speed * fish.dir;
    fishGroup.add(fish);
}

function eatFish(player,fish){
    if(player.width > fish.width){
        score += Math.round(fish.width);
        scoreText.setText("分数："+score);
        fish.destroy();
        //吃掉小鱼，自己变大一点
        player.width +=3;
        player.height +=1.8;
        //补新鱼
        spawnFish.call(this);
    }else if(player.width < fish.width){
        //被大鱼吃掉，游戏结束
        this.add.text(400,300,"游戏结束！分数："+score,{font:"36px Arial",fill:"#ff4444"}).setOrigin(0.5);
        this.physics.pause();
    }
}

function update(){
    //方向键控制移动
    if(cursors.left.isDown) player.body.setVelocityX(-220);
    else if(cursors.right.isDown) player.body.setVelocityX(220);
    else player.body.setVelocityX(0);

    if(cursors.up.isDown) player.body.setVelocityY(-220);
    else if(cursors.down.isDown) player.body.setVelocityY(220);
    else player.body.setVelocityY(0);

    //鱼碰到边界反弹
    fishGroup.children.iterate(fish=>{
        if(fish.x < 20 || fish.x>780){
            fish.dir *= -1;
            fish.body.velocity.x = fish.speed * fish.dir;
        }
    })
}
</script>

<!-- 自愿打赏区域 -->
<div style="margin-top:20px;color:#cccccc;">
  <p>游戏免费，自愿打赏支持开发</p>
  <p>打赏仅自愿，不解锁任何内容</p>
</div>
</body>
</html>
