<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08131f"><title>大鱼吃小鱼</title><style>
:root{--bg:#06121c;--cyan:#5ee7ff;--pink:#ff6b9c;--muted:#91aabd}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#edfbff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}.shell{width:min(1100px,100%);height:100svh;margin:auto;padding:18px;display:grid;grid-template-rows:auto 1fr auto;gap:12px}header{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px}.logo{font-size:28px}.eyebrow{margin:2px 0 0;color:var(--muted);font-size:11px;letter-spacing:.12em}h1{font-size:20px;margin:0}.stats{display:flex;gap:7px}.stat{background:#102333;border:1px solid #ffffff1c;border-radius:9px;padding:7px 12px;min-width:75px}.stat span{display:block;color:var(--muted);font-size:10px}.stat strong{font-size:18px}.game{position:relative;min-height:0;border:1px solid #62dff44d;border-radius:16px;overflow:hidden;box-shadow:0 15px 50px #0008;background:#071521}canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#06121c99}.hidden{display:none}.modal{text-align:center;width:min(390px,calc(100% - 32px));padding:26px 22px;border:1px solid #6de8ff66;border-radius:14px;background:#071722ee}.modal small{color:var(--cyan);letter-spacing:.18em}.modal h2{font-size:30px;margin:9px 0}.modal p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 18px}button{border:0;border-radius:8px;padding:12px 25px;background:var(--cyan);color:#05202a;font-weight:700;font-size:14px;cursor:pointer}footer{display:flex;justify-content:space-between;color:#668196;font-size:11px}@media(max-width:700px){.shell{padding:12px;gap:9px}.game{height:calc(100svh - 105px)}footer{display:none}.stat{min-width:65px;padding:6px 8px}h1{font-size:17px}.eyebrow{font-size:9px}}
</style></head><body><div class="shell"><header><div class="brand"><div class="logo">🐟</div><div><h1>大鱼吃小鱼</h1><p class="eyebrow">OCEAN SURVIVAL · MINI GAME</p></div></div><div class="stats"><div class="stat"><span>得分</span><strong id="score">0</strong></div><div class="stat"><span>记录</span><strong id="best">0</strong></div></div></header><div class="game" id="game"><canvas id="canvas"></canvas><div class="overlay" id="overlay"><div class="modal"><small>OCEAN SURVIVAL</small><h2 id="title">大鱼吃小鱼</h2><p id="msg">吃掉比你小的鱼，变得越来越大。躲开大鱼，看看你能称霸海洋多久！</p><button id="start">开始游戏</button></div></div></div><footer><span>拖动屏幕或使用方向键控制</span><span>手机 · 电脑均可玩</span></footer></div><script>
const c=document.querySelector('#canvas'),x=c.getContext('2d'),box=document.querySelector('#game'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),overlay=document.querySelector('#overlay'),startBtn=document.querySelector('#start'),title=document.querySelector('#title'),msg=document.querySelector('#msg');let W,H,dpr,run=false,last,score=0,best=+localStorage.getItem('fish-best')||0,fish=[],bubbles=[],player={x:0,y:0,r:25,targetX:0,targetY:0};bestEl.textContent=best;
function resize(){let r=box.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);player.y=H*.55;if(!player.x)player.x=W*.5;player.targetX=player.x;player.targetY=player.y;bubbles=Array.from({length:35},()=>({x:Math.random()*W,y:Math.random()*H,s:1+Math.random()*3,v:10+Math.random()*25}));}addEventListener('resize',resize);resize();
function reset(){score=0;fish=[];player.r=25;player.x=W/2;player.y=H*.55;player.targetX=player.x;player.targetY=player.y;scoreEl.textContent=0}
function start(){reset();run=true;overlay.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}startBtn.onclick=start;
function move(px,py){let r=c.getBoundingClientRect();player.targetX=Math.max(30,Math.min(W-30,px-r.left));player.targetY=Math.max(35,Math.min(H-35,py-r.top))}c.addEventListener('pointermove',e=>move(e.clientX,e.clientY));c.addEventListener('pointerdown',e=>move(e.clientX,e.clientY));addEventListener('keydown',e=>{if(e.key==='ArrowLeft')player.targetX-=45;if(e.key==='ArrowRight')player.targetX+=45;if(e.key==='ArrowUp')player.targetY-=45;if(e.key==='ArrowDown')player.targetY+=45;if(e.key===' '&&!run)start()});
function addFish(){let r=8+Math.random()*30+Math.min(22,score/12),big=r>player.r*1.08;fish.push({x:Math.random()<.5?-r:W+r,y:70+Math.random()*(H-140),r,dir:Math.random()<.5?1:-1,v:25+Math.random()*35+score/18,color:big?'#ff6b9c':r<16?'#ffe08a':'#70d7ff'})}
function loop(t){if(!run)return;let dt=Math.min(.035,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
function update(dt){if(Math.random()<dt*(1.7+score/250))addFish();player.x+=(player.targetX-player.x)*dt*6;player.y+=(player.targetY-player.y)*dt*6;fish.forEach(f=>f.x+=f.v*f.dir*dt);for(let i=fish.length-1;i>=0;i--){let f=fish[i];if(f.x<-70||f.x>W+70){fish.splice(i,1);continue}if(Math.hypot(f.x-player.x,f.y-player.y)<f.r+player.r*.72){if(f.r<player.r*.96){score+=Math.ceil(f.r);player.r=Math.min(62,player.r+.7);scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('fish-best',best)}fish.splice(i,1)}else return over()}}bubbles.forEach(b=>{b.y-=b.v*dt;if(b.y<0){b.y=H;b.x=Math.random()*W}})}
function drawFish(f){x.save();x.translate(f.x,f.y);if(f.dir<0)x.scale(-1,1);x.fillStyle=f.color;x.shadowColor=f.color;x.shadowBlur=12;x.beginPath();x.ellipse(0,0,f.r*1.25,f.r*.7,0,0,Math.PI*2);x.fill();x.beginPath();x.moveTo(-f.r,0);x.lineTo(-f.r*1.8,-f.r*.8);x.lineTo(-f.r*1.8,f.r*.8);x.closePath();x.fill();x.fillStyle='#06202a';x.beginPath();x.arc(f.r*.65,-f.r*.18,Math.max(2,f.r*.12),0,7);x.fill();x.restore()}
function draw(){x.fillStyle='#071b29';x.fillRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0c2d40');g.addColorStop(1,'#06202d');x.fillStyle=g;x.fillRect(0,0,W,H);bubbles.forEach(b=>{x.strokeStyle='#b4f4ff55';x.lineWidth=1;x.beginPath();x.arc(b.x,b.y,b.s,0,7);x.stroke()});fish.forEach(drawFish);drawFish({x:player.x,y:player.y,r:player.r,dir:1,color:'#5ee7ff'});x.fillStyle='#e8fbff';x.font='14px system-ui';x.fillText('吃掉小鱼，继续长大！',18,27)}
function over(){run=false;title.textContent='游戏结束';msg.textContent='你吃到了 '+score+' 分！再来一次，成为海洋霸主吧。';startBtn.textContent='再玩一次';overlay.classList.remove('hidden')} 
</script></body></html>
